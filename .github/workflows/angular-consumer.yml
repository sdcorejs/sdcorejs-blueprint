name: Angular Blueprint validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation/angular-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: validation/angular-foundation/package-lock.json
      - run: npm ci
      - run: npm run check
  consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation/angular-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: validation/angular-consumer/.node-version
          cache: npm
          cache-dependency-path: validation/angular-consumer/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-consumer-results
          path: |
            validation/angular-consumer/playwright-report/
            validation/angular-consumer/test-results/
          retention-days: 7
